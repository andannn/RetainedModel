[versions]
agp = "9.1.1"
kotlin = "2.3.20"
compose = "1.9.0"
retain = "1.11.0-rc01"
mavenPublish = "0.36.0"
uiTooling = "1.11.0"
expresso = "3.7.0"

[libraries]
compose-runtime-retain = { module = "androidx.compose.runtime:runtime-retain", version.ref = "retain" }

# For test
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "expresso" }
compose-ui-test-junit4-android = { group = "androidx.compose.ui", name = "ui-test-junit4-android", version.ref = "uiTooling" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "uiTooling" }
jetbrains-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
